name: Validate website

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required files
        run: |
          test -s index.html
          test -s styles.css
          grep -q 'assets/hero.gif' index.html
